<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Perfil | ServiA/CPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/perfil.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-container"></div>

    <div class="profile-banner w-100"></div>

    <div class="container profile-container mt-4 mb-5">
        <div class="row g-4 align-items-start">

            <div class="container profile-container mt-4 mb-5">
        <div class="row g-4 align-items-start"> <div class="col-12 col-lg-4 col-xl-3">
                <div class="card border-0 shadow-sm rounded-4 text-center mb-4 overflow-hidden">
                    <div class="bg-primary bg-opacity-10" style="height: 80px; width: 100%; position: absolute; top: 0; left: 0; z-index: 0;"></div>
                    <div class="card-body px-4 pb-4 pt-5 position-relative" style="z-index: 1;">
                        <div class="avatar-upload-box position-relative overflow-hidden group mx-auto mb-3 mt-2 shadow-sm" style="width: 110px; height: 110px; border-radius: 50%; background: white; padding: 4px;">
                            <img id="profileAvatarImg" src="" class="rounded-circle w-100 h-100 object-fit-cover" />
                            <div class="avatar-edit-overlay d-flex align-items-center justify-content-center position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 text-white rounded-circle opacity-0 transition-all cursor-pointer" onclick="document.getElementById('avatarInput').click()">
                                <i class="fas fa-camera fa-lg"></i>
                            </div>
                        </div>
                        <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/jpg" class="d-none" onchange="subirAvatar(this)">
                        <h5 class="fw-bold text-dark mb-1 mt-3" id="lblNombreLateral">Cargando...</h5>
                        <p class="text-muted small mb-0" id="lblEmailLateral">usuario@ejemplo.com</p>
                    </div>
                </div>

                <button class="btn btn-primary w-100 d-flex justify-content-center align-items-center p-3 rounded-4 shadow-sm border-0 d-lg-none mb-4 fw-bold" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenuPerfil">
                    <i class="fas fa-bars me-2"></i> <span id="textoMenuMovil">Panel Principal</span>
                </button>

                <div class="offcanvas-lg offcanvas-start border-0 shadow-sm rounded-4" tabindex="-1" id="offcanvasMenuPerfil" style="max-width: 280px;">
                    <div class="offcanvas-header bg-light border-bottom px-4 py-3 d-lg-none">
                        <h5 class="offcanvas-title fw-bold text-dark mb-0"><i class="fas fa-user-circle text-primary me-2"></i>Opciones</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#offcanvasMenuPerfil"></button>
                    </div>
                    <div class="offcanvas-body p-3 p-lg-0">
                        <div class="card border-0 shadow-sm rounded-4 p-3 mb-0 bg-white w-100">
                            <div class="nav flex-column nav-pills nav-pills-custom gap-2" id="v-pills-tab" role="tablist">
                                <button class="nav-link active d-flex align-items-center" data-seccion="dashboard" type="button" role="tab">
                                    <i class="fas fa-home text-center" style="width: 25px;"></i> <span class="ms-2">Panel Principal</span>
                                </button>
                                <button class="nav-link d-flex align-items-center justify-content-between" data-seccion="pedidos" type="button" role="tab">
                                    <div class="d-flex align-items-center"><i class="fas fa-box-open text-center" style="width: 25px;"></i> <span class="ms-2">Mis Pedidos</span></div>
                                    <span id="badgePedidosCliente" class="badge bg-danger rounded-pill shadow-sm" style="display: none;">0</span>
                                </button>
                                <button class="nav-link d-flex align-items-center justify-content-between" data-seccion="equipos" type="button" role="tab">
                                    <div class="d-flex align-items-center"><i class="fas fa-snowflake text-center" style="width: 25px;"></i> <span class="ms-2">Mis Equipos</span></div>
                                    <span id="badgeEquiposCliente" class="badge bg-warning text-dark rounded-pill shadow-sm" style="display: none;">0</span>
                                </button>
                                <button class="nav-link d-flex align-items-center justify-content-between" data-seccion="citas" type="button" role="tab">
                                    <div class="d-flex align-items-center"><i class="fas fa-calendar-check text-center" style="width: 25px;"></i> <span class="ms-2">Mis Citas</span></div>
                                    <span id="badgeCitasCliente" class="badge bg-primary rounded-pill shadow-sm" style="display: none;">0</span>
                                </button>
                                <button class="nav-link d-flex align-items-center justify-content-between" data-seccion="solicitudes" type="button" role="tab">
                                    <div class="d-flex align-items-center"><i class="fas fa-headset text-center" style="width: 25px;"></i> <span class="ms-2">Solicitudes</span></div>
                                    <span id="badgeSolicitudesCliente" class="badge bg-danger rounded-pill shadow-sm" style="display: none;">0</span>
                                </button>
                                <button class="nav-link d-flex align-items-center" data-seccion="datos" type="button" role="tab">
                                    <i class="fas fa-user-cog text-center" style="width: 25px;"></i> <span class="ms-2">Ajustes</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-8 col-xl-9">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 p-lg-5" id="perfilContent">
                        </div>
                </div>
            </div>

        </div>
    </div>

            <div class="col-12 col-lg-8 col-xl-9">
                <div class="card card-profile-content border-0 h-100 perfil-card-vibrant">
                    <div class="card-body p-4 p-lg-5" id="perfilContent">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="modalDetallesGlobal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header bg-primary text-white border-0 py-3">
                    <h5 class="modal-title fw-bold" id="detallesModalTitle">
                        <i class="fas fa-info-circle me-2"></i> Detalles
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="detallesModalBody">
                    </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-secondary rounded-pill px-4 fw-bold" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i> Cerrar
                    </button>
                    <button type="button" class="btn btn-danger rounded-pill px-4 fw-bold d-none" id="btnArchivarDesdeModal">
                        <i class="fas fa-archive me-1"></i> Archivar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/chat.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/perfil.js"></script>

    <script src="./js/componentes.js"></script>
</body>
</html>
