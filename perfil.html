<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Perfil | ServiA/CPro</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Estilos globales -->
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Estilos exclusivos del perfil (MODERNOS) -->
    <link rel="stylesheet" href="./css/perfil.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- ===== NAVBAR (EXACTAMENTE IGUAL A index.html) ===== -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">ServiA<span class="text-info">CPro</span></a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="calculadora.html">Asistente Inteligente</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0" id="authButtons"></div>
                <a href="carrito.html" class="position-relative ms-lg-3 mt-3 mt-lg-0 text-dark text-decoration-none fs-5">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-info cart-count" style="display: none; font-size: 0.65rem;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- ===== BANNER SUPERIOR ===== -->
    <div class="profile-banner w-100"></div>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <div class="container profile-container mt-4">
        <div class="row g-4 justify-content-center">

            <!-- ===== SIDEBAR CON AVATAR ===== -->
            <div class="col-lg-4 col-xl-3">
                <div class="card card-profile-sidebar text-center mb-4">
                    <div class="card-body px-4 pb-4">
                        <!-- Avatar con overlay -->
                        <div class="avatar-upload-box position-relative overflow-hidden group">
                            <img id="profileAvatarImg" src="" class="rounded-circle w-100 h-100 object-fit-cover shadow-inner" />
                            <div class="avatar-edit-overlay d-flex align-items-center justify-content-center position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 text-white rounded-circle opacity-0 transition-all cursor-pointer"
                                 style="cursor: pointer;" onclick="document.getElementById('avatarInput').click()">
                                <i class="fas fa-camera fa-2x"></i>
                            </div>
                        </div>
                        <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/jpg" class="d-none" onchange="subirAvatar(this)">

                        <p class="text-muted small mt-2 mb-0">Toca la foto para cambiarla</p>
                        <h4 class="fw-bold text-dark mt-3 mb-1" id="lblNombreLateral">Cargando...</h4>
                        <p class="text-muted small mb-0" id="lblEmailLateral">usuario@ejemplo.com</p>
                    </div>
                </div>

                <!-- Menú lateral (pestañas) -->
                <div class="card card-profile-sidebar p-3">
                    <div class="nav flex-column nav-pills nav-pills-custom" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                        <button class="nav-link active" data-seccion="dashboard" type="button" role="tab">
                            <i class="fas fa-home"></i> Panel Principal
                        </button>
                        <button class="nav-link" data-seccion="pedidos" type="button" role="tab">
                            <i class="fas fa-box-open"></i> Mis Pedidos
                            <span id="badgePedidosCliente" class="badge bg-danger rounded-pill ms-auto" style="display: none;">0</span>
                        </button>
                        <button class="nav-link" data-seccion="equipos" type="button" role="tab">
                            <i class="fas fa-snowflake"></i> Mis Equipos
                            <span id="badgeEquiposCliente" class="badge bg-warning rounded-pill ms-auto" style="display: none;">0</span>
                        </button>
                        <button class="nav-link" data-seccion="citas" type="button" role="tab">
                            <i class="fas fa-calendar-check"></i> Mis Citas
                            <span id="badgeCitasCliente" class="badge bg-danger rounded-pill ms-auto" style="display: none;">0</span>
                        </button>
                        <button class="nav-link" data-seccion="solicitudes" type="button" role="tab">
                            <i class="fas fa-headset"></i> Solicitudes
                            <span id="badgeSolicitudesCliente" class="badge bg-danger rounded-pill ms-auto" style="display: none;">0</span>
                        </button>
                        <button class="nav-link" data-seccion="datos" type="button" role="tab">
                            <i class="fas fa-user-edit"></i> Datos Personales
                        </button>
                    </div>
                </div>
            </div>

            <!-- ===== CONTENIDO DINÁMICO ===== -->
            <div class="col-lg-8 col-xl-9">
                <div class="card card-profile-content h-100">
                    <div class="card-body p-4 p-lg-5" id="perfilContent">
                        <!-- Se carga dinámicamente -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- ===== MODAL CHAT ===== -->
    <div class="modal fade" id="modalChat" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="fas fa-comment-dots me-2"></i>Chat
                        <span id="chatNombreDestinatario" class="ms-2 small text-white-50"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <!-- Contenedor de mensajes -->
                    <div id="chatContainer" style="height: 400px; overflow-y: auto; padding: 1rem 1.5rem; background: #f8faff;"></div>
                    <!-- Input de mensaje -->
                    <div class="p-3 bg-white border-top d-flex gap-2">
                        <input type="text" id="chatInput" class="form-control rounded-pill border-0 bg-light" placeholder="Escribe un mensaje..." autocomplete="off">
                        <button id="chatSendBtn" class="btn btn-primary rounded-pill px-4">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL DE DETALLES MEJORADO ===== -->
    <div class="modal fade" id="modalDetallesGlobal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header bg-primary text-white border-0 py-3">
                    <h5 class="modal-title fw-bold" id="detallesModalTitle">
                        <i class="fas fa-info-circle me-2"></i> Detalles
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="detallesModalBody">
                    <!-- Se llena dinámicamente con JS -->
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-secondary rounded-pill px-4 fw-bold" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i> Cerrar
                    </button>
                    <button type="button" class="btn btn-danger rounded-pill px-4 fw-bold d-none" id="btnArchivarDesdeModal">
                        <i class="fas fa-archive me-1"></i> Archivar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <small class="text-secondary">&copy; 2026 Servi A/C Pro - Proyecto Ingeniería en Sistemas. Todos los derechos reservados.</small>
        </div>
    </footer>

    <!-- ===== SCRIPTS (orden corregido) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/chat.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/perfil.js"></script>
</body>
</html>
