    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="./css/main.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">Clima<span class="text-info">Pro</span></a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="calculadora.html">Asistente Inteligente</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0" id="authButtons"></div>
                <a href="carrito.html" class="position-relative ms-lg-3 mt-3 mt-lg-0 text-dark text-decoration-none fs-5">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-info cart-count" style="display: none; font-size: 0.65rem;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-4">
        <div class="container">
            <h2 class="fw-bold mb-0">Finalizar Compra</h2>
        </div>
    </header>

    <section class="py-5 flex-grow-1">
        <div class="container">
            <div class="row g-4">
                
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-body p-4 p-md-5">
                            <h4 class="fw-bold text-dark border-bottom pb-3 mb-4">Datos de envío e instalación</h4>
                            
                            <form id="checkoutForm">
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-secondary">Nombre completo</label>
                                        <input type="text" class="form-control bg-light" id="checkoutNombre" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-secondary">Correo electrónico</label>
                                        <input type="email" class="form-control bg-light" id="checkoutEmail" readonly>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">Dirección de instalación <span class="text-danger">*</span></label>
                                    <textarea class="form-control" name="direccion" rows="3" required placeholder="Detalles exactos para la visita técnica (Colonia, pasaje, casa...)"></textarea>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-dark">Teléfono de contacto <span class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" name="telefono" required placeholder="Ej. 7000-0000">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-dark">Fecha preferida (Opcional)</label>
                                        <input type="date" class="form-control" name="fecha_preferida">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">Método de pago <span class="text-danger">*</span></label>
                                    <select class="form-select" name="metodo_pago" required>
                                        <option value="" disabled selected>Selecciona una opción...</option>
                                        <option value="EFECTIVO">Efectivo contra entrega</option>
                                        <option value="TRANSFERENCIA">Transferencia bancaria</option>
                                        <option value="TARJETA">Tarjeta (En línea)</option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm">
                                    Confirmar Pedido <i class="fas fa-check-circle ms-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 sticky-lg-top" style="top: 100px;">
                        <div class="card-body p-4">
                            <h5 class="fw-bold text-dark border-bottom pb-3 mb-4">Resumen del Pedido</h5>
                            
                            <div id="checkoutSummaryItems" class="mb-4">
                                </div>
                            
                            <div class="d-flex justify-content-between mb-3 text-muted">
                                <span>Envío</span>
                                <span>Gratis</span>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <span class="fw-bold fs-5 text-dark">Total a pagar</span>
                                <span class="fw-bold fs-4 text-primary" id="checkoutTotal">$0.00</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <small class="text-secondary">&copy; 2026 ClimaPro - Proyecto Ingeniería en Sistemas. Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/checkout.js"></script>
    <script src="./js/api.js"></script>
</body>
</html>
