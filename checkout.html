<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finalizar Compra | ServiA/CPro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-container"></div>

    <header class="bg-primary text-white text-center py-4">
        <div class="container">
            <h2 class="fw-bold mb-0">Finalizar Compra</h2>
        </div>
    </header>

    <section class="py-5 flex-grow-1">
        <div class="container">
            <div class="row g-4">
                
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-body p-4 p-md-5">
                            <h4 class="fw-bold text-dark border-bottom pb-3 mb-4">Datos de envío e instalación</h4>
                            
                            <form id="checkoutForm">
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-secondary">Nombre completo</label>
                                        <input type="text" class="form-control bg-light" id="checkoutNombre" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-secondary">Correo electrónico</label>
                                        <input type="email" class="form-control bg-light" id="checkoutEmail" readonly>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold text-dark">Dirección de instalación <span class="text-danger">*</span></label>
                                    
                                    <div class="bg-light p-3 rounded-4 border mb-3">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <small class="text-muted fw-semibold"><i class="fas fa-map-marker-alt text-danger me-1"></i> Ubica el pin en tu destino</small>
                                            <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3" id="btnMiUbicacion">
                                                <i class="fas fa-location-crosshairs me-1"></i> Usar mi ubicación
                                            </button>
                                        </div>
                                        <div id="mapaCheckout" style="height: 250px; border-radius: 12px; z-index: 1;" class="shadow-sm border"></div>
                                        <div id="geoStatus" class="small text-muted mt-2"></div>
                                    </div>

                                    <label class="form-label fw-semibold text-secondary small">Complementa tu dirección manual o verifica los datos:</label>
                                    <textarea class="form-control bg-white shadow-sm border" id="direccionInput" name="direccion" rows="3" required placeholder="Colonia, pasaje, número de casa, punto de referencia..."></textarea>
                                </div>
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-dark">Teléfono de contacto <span class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" name="telefono" required placeholder="Ej. 7000-0000">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold text-dark">Fecha preferida (Opcional)</label>
                                        <input type="date" class="form-control" name="fecha_preferida">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">Método de pago <span class="text-danger">*</span></label>
                                    <select class="form-select" name="metodo_pago" required>
                                        <option value="" disabled selected>Selecciona una opción...</option>
                                        <option value="EFECTIVO">Efectivo contra entrega</option>
                                        <option value="TRANSFERENCIA">Transferencia bancaria</option>
                                        <option value="TARJETA">Tarjeta (En línea)</option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm rounded-pill">
                                    Confirmar Pedido <i class="fas fa-check-circle ms-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 sticky-lg-top" style="top: 100px;">
                        <div class="card-body p-4">
                            <h5 class="fw-bold text-dark border-bottom pb-3 mb-4">Resumen del Pedido</h5>
                            
                            <div id="checkoutSummaryItems" class="mb-4"></div>
                            
                            <div class="d-flex justify-content-between mb-3 text-muted">
                                <span>Envío</span>
                                <span>Gratis</span>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <span class="fw-bold fs-5 text-dark">Total a pagar</span>
                                <span class="fw-bold fs-3 text-primary" id="checkoutTotal">$0.00</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <small class="text-secondary">&copy; 2026 Servi A/C Pro - Proyecto Ingeniería en Sistemas. Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="./js/auth.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/checkout.js"></script>
    <script src="./js/api.js"></script>

    <script src="./js/componentes.js"></script>
</body>
</html>
