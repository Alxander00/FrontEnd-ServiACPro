<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">ServiA<span class="text-info">CPro</span></a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="calculadora.html">Asistente Inteligente</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5 flex-grow-1 d-flex align-items-center bg-gradient-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 text-center">
                        <div class="mb-4">
                            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3 fs-3">
                                <i class="fas fa-user-lock"></i>
                            </div>
                            <h2 class="fw-bold text-dark">Bienvenido de nuevo</h2>
                            <p class="text-muted">Ingresa tus credenciales para acceder a tu panel.</p>
                        </div>
                        
                        <form id="loginForm" class="text-start">
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-envelope text-muted"></i></span>
                                    <input type="email" class="form-control bg-light border-0 py-2" id="email" placeholder="tu@correo.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-secondary d-flex justify-content-between">
                                    Contraseña
                                    <a href="recuperar.html" class="text-decoration-none small text-info">¿Olvidaste tu contraseña?</a>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                                    <input type="password" class="form-control bg-light border-0 py-2" id="password" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm">Ingresar a mi cuenta</button>
                        </form>
                        
                        <div class="mt-4 pt-4 border-top">
                            <p class="text-muted mb-0">¿Aún no eres cliente? <a href="registro.html" class="text-info fw-bold text-decoration-none">Crea tu cuenta aquí</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 mt-auto">

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
