<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ClimaPro Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<div class="container-fluid">
    <div class="row flex-nowrap">
        <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar text-white">
            <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-4 text-white min-vh-100">
                <a href="#" class="d-flex align-items-center pb-3 mb-md-0 me-md-auto text-white text-decoration-none border-bottom w-100">
                    <span class="fs-4 fw-bold">Clima<span class="text-accent">Pro</span></span>
                </a>
                <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start w-100 mt-4" id="menu">
                    <li class="nav-item w-100"><a href="#" class="nav-link active" data-page="dashboard"><i class="fas fa-home me-2"></i> <span class="d-none d-sm-inline">Dashboard</span></a></li>
                    <li class="nav-item w-100"><a href="#" class="nav-link" data-page="productos"><i class="fas fa-box me-2"></i> <span class="d-none d-sm-inline">Productos</span></a></li>
                    <li class="nav-item w-100"><a href="#" class="nav-link" data-page="pedidos">
                        <i class="fas fa-shopping-cart me-2"></i> <span class="d-none d-sm-inline">Pedidos</span>
                        <span id="badgePedidosAdmin" class="badge bg-danger rounded-pill ms-2" style="display: none; font-size: 0.7rem;">0</span>
                    </a></li>
                    <li class="nav-item w-100">
                        <a href="#" class="nav-link" data-page="categorias">
                            <i class="fas fa-tags me-2"></i> <span class="d-none d-sm-inline">Categorías</span>
                        </a>
                    </li>
                    <li class="nav-item w-100"><a href="#" class="nav-link" data-page="usuarios"><i class="fas fa-users me-2"></i> <span class="d-none d-sm-inline">Usuarios</span></a></li>
                    <li class="nav-item w-100"><a href="#" class="nav-link" data-page="solicitudes">
                        <i class="fas fa-inbox me-2"></i> <span class="d-none d-sm-inline">Solicitudes</span>
                        <span id="badgeSolicitudesAdmin" class="badge bg-danger rounded-pill ms-2" style="display: none; font-size: 0.7rem;">0</span>
                    </a></li>
                </ul>
                <hr class="w-100">
                <div class="pb-4">
                    <a href="index.html" class="text-white text-decoration-none"><i class="fas fa-sign-out-alt me-2"></i> <span class="d-none d-sm-inline">Salir</span></a>
                </div>
            </div>
        </div>

        <div class="col py-3">
            <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4 px-3">
                <div class="container-fluid">
                    <div>
                        <h4 class="mb-0 fw-bold text-dark" id="sectionTitle">Dashboard</h4>
                        <small class="text-muted" id="sectionSubtitle">Resumen general del sistema</small>
                    </div>
                    <div class="d-flex align-items-center">
                        <div class="input-group me-3">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" class="form-control bg-light border-0" placeholder="Buscar...">
                        </div>
                        <img src="./img/breezeless_ambiente.png" alt="Admin" width="40" height="40" class="rounded-circle border border-info">
                    </div>
                </div>
            </nav>

            <div id="dynamicContent"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="productoModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">Agregar Producto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="productoForm">
                    <input type="hidden" id="productoId">
                    <div class="row mb-3">
                        <div class="col-md-6"><label class="form-label fw-bold">Nombre</label><input type="text" class="form-control" id="prodNombre" required></div>
                        <div class="col-md-6"><label class="form-label fw-bold">Marca</label><input type="text" class="form-control" id="prodMarca" required></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6"><label class="form-label fw-bold">Categoría</label><select class="form-select" id="prodCategoria" required><option value="">Cargando...</option></select></div>
                        <div class="col-md-6"><label class="form-label fw-bold">Precio ($)</label><input type="number" class="form-control" id="prodPrecio" step="0.01" required></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6"><label class="form-label fw-bold">BTU</label><input type="number" class="form-control" id="prodBTU"></div>
                        <div class="col-md-6"><label class="form-label fw-bold">Stock</label><input type="number" class="form-control" id="prodStock" value="10"></div>
                    </div>
                    <div class="mb-3"><label class="form-label fw-bold">Imagen del Producto</label><input type="file" class="form-control" id="prodImagenes" accept="image/*" multiple><small class="text-muted">Selecciona una imagen desde tu dispositivo (JPG, PNG, WEBP).</small></div>
                    <div class="mb-4"><label class="form-label fw-bold">Descripción</label><textarea class="form-control" id="prodDescripcion" rows="3"></textarea></div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Guardar Producto</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./js/admin.js"></script>
<script src="./js/api.js"></script>
</body>
</html>
