<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recuperar Contraseña | ServiA/CPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/responsive.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-container"></div>

    <section class="py-5 flex-grow-1 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-key fa-3x text-primary mb-3"></i>
                            <h3 class="fw-bold text-dark">¿Olvidaste tu contraseña?</h3>
                            <p class="text-muted">Te enviaremos un enlace para restablecerla.</p>
                        </div>
                        <form id="forgotPasswordForm">
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="tu@correo.com" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm">
                                Enviar enlace de recuperación
                            </button>
                        </form>
                        <div class="text-center mt-4">
                            <a href="login.html" class="text-decoration-none small">← Volver al inicio de sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/recuperar.js"></script>

    <script src="./js/componentes.js"></script>
</body>
</html>
