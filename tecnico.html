<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Técnico | ServiA/CPro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    
    <!-- Leaflet CSS (para mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css' rel='stylesheet' />
</head>
<body class="bg-light">

    <!-- Navbar consistente con el resto del sitio -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">ServiA<span class="text-info">CPro</span></a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="calculadora.html">Asistente Inteligente</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0" id="authButtons"></div>
                <a href="carrito.html" class="position-relative ms-lg-3 mt-3 mt-lg-0 text-dark text-decoration-none fs-5">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-info cart-count" style="display: none; font-size: 0.65rem;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h4 class="fw-bold text-dark mb-0">Mi Agenda</h4>
            <div class="btn-group" role="group">
                <button type="button" id="btnVistaTarjetas" class="btn btn-outline-primary active">
                    <i class="fas fa-th-large me-1"></i> Tarjetas
                </button>
                <button type="button" id="btnVistaCalendario" class="btn btn-outline-primary">
                    <i class="fas fa-calendar-alt me-1"></i> Calendario
                </button>
            </div>
            <span class="badge bg-primary rounded-pill px-3 py-2" id="fechaActual"></span>
        </div>

        <!-- Vista de tarjetas -->
        <div id="vistaTarjetas">
            <div class="row g-4" id="agendaContainer"></div>
        </div>

        <!-- Vista de calendario (oculta por defecto) -->
        <div id="vistaCalendario" style="display: none;">
            <div id="calendar" class="bg-white rounded-4 shadow-sm p-3"></div>
        </div>
    </div>

    <!-- Modal para actualizar estado de cita -->
    <div class="modal fade" id="modalActualizarEstado" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold">Reporte de Visita</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEstadoCita">
                        <input type="hidden" id="citaIdActual">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Nuevo Estado</label>
                            <select class="form-select bg-light border-0 py-2" id="nuevoEstado" required>
                                <option value="En Camino">En Camino</option>
                                <option value="En Proceso">En Proceso</option>
                                <option value="Completado">Trabajo Completado</option>
                                <option value="Reprogramado">No atiende / Reprogramar</option>
                            </select>
                        </div>
                        
                        <div id="seccionEvidencia" style="display: none;" class="bg-primary bg-opacity-10 p-3 rounded-4 mb-4 border border-primary border-opacity-25">
                            <h6 class="fw-bold text-primary mb-3"><i class="fas fa-camera text-primary me-2"></i>Evidencia del Trabajo</h6>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Fotos del Antes (Opcional)</label>
                                <input type="file" class="form-control bg-white border-0 shadow-sm" id="fotoAntes" accept="image/*" multiple>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Fotos del Después <span class="text-danger">*</span></label>
                                <input type="file" class="form-control bg-white border-0 shadow-sm" id="fotoDespues" accept="image/*" multiple>
                            </div>
                            
                            <hr class="my-3 border-primary opacity-25">
                            
                            <div class="mb-2">
                                <label class="form-label fw-semibold small">Firma del Cliente <span class="text-danger">*</span></label>
                                <div class="border border-2 border-primary border-opacity-50 rounded-3 bg-white overflow-hidden shadow-sm" style="touch-action: none;">
                                    <canvas id="firmaCanvas" height="150" style="width: 100%; cursor: crosshair; display: block;"></canvas>
                                </div>
                                <div class="text-end mt-2">
                                    <button type="button" class="btn btn-sm btn-outline-danger" id="btnLimpiarFirma">
                                        <i class="fas fa-eraser me-1"></i>Limpiar Firma
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Notas Técnicas</label>
                            <textarea class="form-control bg-light border-0" id="notasTecnico" rows="3" placeholder="Detalles de la instalación, materiales usados, observaciones..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-3 shadow-sm" id="btnGuardarReporte">
                            Guardar Reporte
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para mapa -->
    <div class="modal fade" id="modalMapa" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-map-marker-alt me-2"></i>Ubicación del cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="mapaCliente" style="height: 400px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/locales/es.js'></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/tecnico.js"></script>
</body>
</html>
