<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Técnico | ServiA/CPro</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d6efd">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css' rel='stylesheet' />
    
    <!-- CSS específico para el panel técnico -->
    <link rel="stylesheet" href="./css/tecnico.css">
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <div id="navbar-container"></div>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <div class="container py-4">

        <!-- HEADER -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold text-dark mb-0">
                    <i class="fas fa-tools text-primary me-2"></i>Mi Agenda
                </h4>
                <p class="text-muted small mb-0" id="fechaActual"></p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="btnVistaTarjetas">
                    <i class="fas fa-th-large me-1"></i> Tarjetas
                </button>
                <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="btnVistaCalendario">
                    <i class="fas fa-calendar-alt me-1"></i> Calendario
                </button>
            </div>
        </div>

        <!-- ===== DASHBOARD ESTADÍSTICAS ===== -->
        <div class="row g-3 mb-4" id="statsContainer">
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="statHoy">0</div>
                        <div class="stat-label">Hoy</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="statPendientes">0</div>
                        <div class="stat-label">Pendientes</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="stat-icon bg-success bg-opacity-10 text-success">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="statCompletadas">0</div>
                        <div class="stat-label">Completadas</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="stat-icon bg-info bg-opacity-10 text-info">
                        <i class="fas fa-list"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="statTotal">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== FILTROS ===== -->
        <div class="filtros-container">
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" class="form-control" id="buscarCita" placeholder="Buscar por cliente o dirección... (escribe para filtrar)">
                    </div>
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="filtroEstado">
                        <option value="todos">Todos los estados</option>
                        <option value="PROGRAMADA">Programada</option>
                        <option value="EN_PROCESO">En Proceso</option>
                        <option value="COMPLETADA">Completada</option>
                        <option value="CANCELADA">Cancelada</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filtroOrden">
                        <option value="fecha">Ordenar por fecha</option>
                        <option value="cliente">Ordenar por cliente</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ===== VISTA TARJETAS ===== -->
        <div id="vistaTarjetas">
            <div class="row g-4" id="agendaContainer"></div>
        </div>

        <!-- ===== VISTA CALENDARIO ===== -->
        <div id="vistaCalendario" style="display: none;">
            <div class="bg-white rounded-4 shadow-sm p-3">
                <div id="calendar"></div>
            </div>
        </div>

        <!-- ===== PAGINACIÓN ===== -->
        <div id="paginacionContainer" class="d-flex justify-content-between align-items-center mt-4">
            <button class="btn btn-outline-primary rounded-pill px-4 fw-bold shadow-sm" id="btnAnterior" disabled>
                <i class="fas fa-chevron-left me-2"></i> Anterior
            </button>
            <div class="text-center">
                <span class="text-muted small d-block">Mostrando <span id="infoTotalCitas">0</span> citas</span>
                <span class="fw-semibold">
                    Página <span id="paginaActual" class="text-primary">1</span> de <span id="totalPaginas">1</span>
                </span>
            </div>
            <button class="btn btn-outline-primary rounded-pill px-4 fw-bold shadow-sm" id="btnSiguiente" disabled>
                Siguiente <i class="fas fa-chevron-right ms-2"></i>
            </button>
        </div>
    </div>

    <!-- ===== MODAL DETALLES DE CITA ===== -->
    <div class="modal fade" id="modalDetallesCita" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="fas fa-info-circle me-2"></i>Detalles de la Cita
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="detallesCitaBody">
                    <!-- Se llena con JS -->
                </div>
                <div class="modal-footer bg-light">
                    <button class="btn btn-primary fw-bold rounded-pill" id="btnReportarDesdeDetalles">
                        <i class="fas fa-edit me-1"></i> Reportar
                    </button>
                    <button class="btn btn-outline-info fw-bold rounded-pill" id="btnMapaDesdeDetalles">
                        <i class="fas fa-map-marked-alt me-1"></i> Mapa
                    </button>
                    <button class="btn btn-secondary fw-bold rounded-pill" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ACTUALIZAR ESTADO -->
    <div class="modal fade" id="modalActualizarEstado" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="fas fa-clipboard-check me-2"></i>Reporte de Visita
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEstadoCita">
                        <input type="hidden" id="citaIdActual">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Nuevo Estado</label>
                            <select class="form-select bg-light border-0 py-2" id="nuevoEstado" required>
                                <option value="En Camino">En Camino</option>
                                <option value="En Proceso">En Proceso</option>
                                <option value="Completado">Trabajo Completado</option>
                                <option value="Reprogramado">No atiende / Reprogramar</option>
                            </select>
                        </div>
                        <div id="seccionEvidencia" style="display: none;" class="bg-primary bg-opacity-10 p-3 rounded-4 mb-4 border border-primary border-opacity-25">
                            <h6 class="fw-bold text-primary mb-3">
                                <i class="fas fa-camera text-primary me-2"></i>Evidencia del Trabajo
                            </h6>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Fotos del Antes (Opcional)</label>
                                <input type="file" class="form-control bg-white border-0 shadow-sm" id="fotoAntes" accept="image/*" multiple>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Fotos del Después <span class="text-danger">*</span></label>
                                <input type="file" class="form-control bg-white border-0 shadow-sm" id="fotoDespues" accept="image/*" multiple>
                            </div>
                            <hr class="my-3 border-primary opacity-25">
                            <div class="mb-2">
                                <label class="form-label fw-semibold small">Firma del Cliente <span class="text-danger">*</span></label>
                                <div class="border border-2 border-primary border-opacity-50 rounded-3 bg-white overflow-hidden shadow-sm" style="touch-action: none;">
                                    <canvas id="firmaCanvas" height="150" style="width: 100%; cursor: crosshair; display: block;"></canvas>
                                </div>
                                <div class="text-end mt-2">
                                    <button type="button" class="btn btn-sm btn-outline-danger" id="btnLimpiarFirma">
                                        <i class="fas fa-eraser me-1"></i>Limpiar Firma
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Notas Técnicas</label>
                            <textarea class="form-control bg-light border-0" id="notasTecnico" rows="3" placeholder="Detalles de la instalación, materiales usados, observaciones..."></textarea>
                        </div>
                        <div class="mb-4 p-3 bg-white border rounded-3 shadow-sm">
                            <label class="form-label fw-bold text-dark mb-2">
                                <i class="fas fa-toolbox text-secondary me-2"></i>Materiales Utilizados
                            </label>
                            <div id="contenedorRepuestos" class="mb-2"></div>
                            <button type="button" class="btn btn-sm btn-outline-primary fw-bold rounded-pill w-100" onclick="agregarFilaRepuesto()">
                                <i class="fas fa-plus me-1"></i> Agregar Material
                            </button>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-3 shadow-sm" id="btnGuardarReporte">
                            <i class="fas fa-save me-2"></i> Guardar Reporte
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL MAPA -->
    <div class="modal fade" id="modalMapa" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-map-marker-alt me-2"></i>Ubicación del cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="mapaCliente" style="height: 400px; width: 100%;"></div>
                </div>
                <div class="modal-footer bg-light">
                    <a id="btnAbrirGoogleMaps" href="#" target="_blank" class="btn btn-google-maps">
                        <i class="fab fa-google"></i> Abrir en Google Maps
                    </a>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL CHAT ===== -->

    <!-- ===== SCRIPTS (orden corregido) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/locales/es.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/chat.js"></script>
    <script src="./js/notificaciones.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/tecnico.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('App lista y registrada con éxito'))
                    .catch(err => console.log('Error al registrar la App: ', err));
            });
        }
    </script>

    <script src="./js/componentes.js"></script>
</body>
</html>
