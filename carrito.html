<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carrito de Compras | ServiA/CPro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-container"></div>

    <header class="bg-primary text-white text-center py-4">
        <div class="container">
            <h2 class="fw-bold mb-0">Tu Carrito de Compras</h2>
        </div>
    </header>

    <section class="py-4 py-md-5 flex-grow-1">
        <div class="container">
            
            <div id="cart-empty" class="text-center py-5" style="display: none;">
                <div class="display-1 text-muted mb-3"><i class="fas fa-shopping-basket"></i></div>
                <h3 class="fw-bold text-dark fs-4">Tu carrito está vacío</h3>
                <p class="text-muted mb-4 small">Parece que aún no has agregado ningún equipo a tu pedido.</p>
                <a href="catalogo.html" class="btn btn-primary fw-bold px-4 py-2 rounded-pill shadow-sm">Explorar Catálogo</a>
            </div>

            <div class="row g-4 justify-content-center" id="cart-container">
                </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/carrito-view.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/componentes.js"></script>
</body>
</html>
